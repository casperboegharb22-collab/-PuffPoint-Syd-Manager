<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuffPoint Syd Manager</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

    <header class="header">
        <h1>💨 PuffPoint Syd Manager</h1>
    </header>

    <nav class="nav">

        <button class="nav-btn active" data-page="dashboard">
            Dashboard
        </button>

        <button class="nav-btn" data-page="lager">
            Lager
        </button>

        <button class="nav-btn" data-page="settings">
            Indstillinger
        </button>

    </nav>

    <!-- DASHBOARD -->

    <section id="dashboard" class="page active">

        <div class="cards">

            <div class="card">
                <h3>Omsætning</h3>
                <span id="revenue">0 kr.</span>
            </div>

            <div class="card">
                <h3>Fortjeneste</h3>
                <span id="profit">0 kr.</span>
            </div>

            <div class="card">
                <h3>Lager</h3>
                <span id="stock">0 stk.</span>
            </div>

        </div>

        <div class="section">

            <h2>🏆 Top 3 bestsellere</h2>

            <div id="topProducts"></div>

        </div>

        <div class="section">

            <h2>⚠️ Lav lager</h2>

            <div id="lowStock"></div>

        </div>

    </section>

    <!-- LAGER -->

    <section id="lager" class="page">

        <div class="section-header">

            <h2>Produkter</h2>

            <button id="addProductBtn">
                + Produkt
            </button>

        </div>

        <div id="productList"></div>

    </section>

    <!-- INDSTILLINGER -->

    <section id="settings" class="page">

        <div class="section">

            <h2>Smage</h2>

            <button id="addFlavorBtn">
                + Ny smag
            </button>

            <div id="flavorList"></div>

        </div>

        <div class="section">

            <button id="resetDataBtn" class="danger">
                Nulstil alle data
            </button>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
