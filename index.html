<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuffPoint Syd Manager</title>

    <meta name="theme-color" content="#18c964">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <img src="logo.png" alt="PuffPoint Syd Logo">
        <div>
            <h1>PuffPoint Syd</h1>
            <p>Manager</p>
        </div>
    </div>
</header>

<main>

    <!-- Dashboard -->
    <section id="dashboard" class="page active">

        <div class="stats-grid">

            <div class="card">
                <h3>💰 Omsætning</h3>
                <h2 id="revenue">0 kr.</h2>
            </div>

            <div class="card">
                <h3>📈 Profit</h3>
                <h2 id="profit">0 kr.</h2>
            </div>

            <div class="card">
                <h3>📦 På lager</h3>
                <h2 id="stock">0 stk.</h2>
            </div>

        </div>

        <div class="card">
            <h2>🏆 Top 3 Bestseller</h2>
            <div id="top3"></div>
        </div>

        <div class="card">
            <h2>🔔 Genbestil</h2>
            <div id="reorderList"></div>
        </div>

    </section>

    <!-- Lager -->
    <section id="lager" class="page">
        <h2>Lager</h2>
        <div id="productList"></div>
    </section>

    <!-- Indkøb -->
   <section id="indkob" class="page">
    <h2>Indkøb</h2>

    <div id="purchaseList"></div>

    <h3 style="margin-top:30px;">📜 Seneste indkøb</h3>

    <div id="purchaseHistory"></div>

</section>

    <!-- Statistik -->
    <section id="statistik" class="page">
        <h2>Statistik</h2>
        <div id="statistics">

    <div class="card">
        <h3>💰 Samlet omsætning</h3>
        <h1 id="statsRevenue">0 kr.</h1>
    </div>

    <div class="card">
        <h3>📈 Samlet profit</h3>
        <h1 id="statsProfit">0 kr.</h1>
    </div>

    <div class="card">
        <h3>📦 Solgte enheder</h3>
        <h1 id="statsSold">0 stk.</h1>
    </div>

    <div class="card">
        <h3>🥇 Mest solgte smag</h3>
        <h2 id="bestSeller">Ingen salg endnu</h2>
    </div>

</div>
    </section>

    <!-- Indstillinger -->
    <section id="settings" class="page">
        <h2>Indstillinger</h2>
        <div id="settingsContent"></div>
    </section>

</main>

<nav class="bottom-nav">

    <button data-page="dashboard">
        🏠
        <span>Dashboard</span>
    </button>

    <button data-page="lager">
        📦
        <span>Lager</span>
    </button>

    <button data-page="indkob">
        🚚
        <span>Indkøb</span>
    </button>

    <button data-page="statistik">
        📊
        <span>Statistik</span>
    </button>

    <button data-page="settings">
        ⚙️
        <span>Indstillinger</span>
    </button>

</nav>

<script src="app.js"></script>

</body>
</html>
