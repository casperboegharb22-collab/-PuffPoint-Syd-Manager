<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PuffPoint Syd Manager</title>

<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#19c37d">
</head>

<body>

<header class="header">
    <h1>PuffPoint Syd Manager</h1>
</header>

<main>

<section id="dashboard">

<div class="cards">

<div class="card">
<h2>Omsætning</h2>
<p id="revenue">0 kr.</p>
</div>

<div class="card">
<h2>Profit</h2>
<p id="profit">0 kr.</p>
</div>

<div class="card">
<h2>På lager</h2>
<p id="stock">0</p>
</div>

<div class="card">
<h2>Bestseller</h2>
<p id="bestSeller">-</p>
</div>

<div class="card">
<h2>Genbestil</h2>
<p id="restock">Ingen</p>
</div>

</div>
<nav class="menu">

<button>Dashboard</button>

<button>Lager</button>

<button>Salg</button>

<button>Indkøb</button>

<button>Statistik</button>

</nav>

<section class="content">
<h2>Lager</h2>

<div id="inventory"></div>

</section>

</section>

</main>

<script src="app.js"></script>

</body>
</html>
